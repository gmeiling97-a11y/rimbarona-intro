<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RimbaRona | BMMB 6033</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #174a36;
  font-family: "Trebuchet MS", Arial, sans-serif;
}

.scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(#7ed3e7, #8ed17e 60%, #20583a);
}

/* Latar ilustrasi 3D */
.forest {
  position: absolute;
  inset: -2%;
  width: 104%;
  height: 104%;
  object-fit: fill;
  z-index: -2;
  animation: cameraMove 18s ease-in-out infinite alternate;
  will-change: transform;
  user-select: none;
}

/* Cahaya matahari bergerak */
.sunbeam {
  position: absolute;
  inset: -50%;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(
    110deg,
    transparent 40%,
    rgba(255, 255, 198, 0.2) 49%,
    transparent 58%
  );
  animation: sunlight 9s ease-in-out infinite;
  mix-blend-mode: screen;
}

/* Kilauan ajaib */
.sparkle {
  position: absolute;
  width: 6px;
  height: 6px;
  z-index: 2;
  border-radius: 50%;
  background: #fff7b0;
  box-shadow:
    0 0 8px 3px rgba(255, 239, 135, 0.7),
    0 0 18px rgba(255, 255, 220, 0.5);
  pointer-events: none;
  animation: sparkle 2.5s ease-in-out infinite alternate;
}

/* Daun bergerak */
.leaf {
  position: absolute;
  z-index: 2;
  top: -8%;
  font-size: clamp(15px, 2vw, 25px);
  pointer-events: none;
  animation: falling var(--speed) linear infinite;
  animation-delay: var(--delay);
  filter: drop-shadow(0 3px 3px #214c2a66);
}

/*
Butang MULA sudah berada dalam gambar.
Kawasan ini hanya menjadikan butang dalam gambar boleh ditekan.
Jangan tambah butang visual kedua.
*/
.start-area {
  position: absolute;
  left: 36.5%;
  top: 57%;
  width: 29.5%;
  height: 17%;
  z-index: 5;
  border: none;
  border-radius: 100px;
  background: transparent;
  cursor: pointer;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

.start-area:focus-visible {
  outline: 4px solid white;
  outline-offset: 5px;
}

.start-area:active {
  transform: scale(0.97);
}

.message {
  position: absolute;
  bottom: 3%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  padding: 10px 18px;
  max-width: 90%;
  color: white;
  background: rgba(22, 75, 48, 0.82);
  border: 1px solid rgba(255,255,255,0.45);
  border-radius: 30px;
  font-size: 13px;
  text-align: center;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
}

.message.show {
  opacity: 1;
}

@keyframes cameraMove {
  0% {
    transform: scale(1.015) translate3d(-0.3%, 0.1%, 0);
  }
  100% {
    transform: scale(1.055) translate3d(0.3%, -0.2%, 0);
  }
}

@keyframes sunlight {
  0%, 15% {
    transform: translateX(-40%);
    opacity: 0;
  }
  35% {
    opacity: 1;
  }
  70%, 100% {
    transform: translateX(40%);
    opacity: 0;
  }
}

@keyframes sparkle {
  from {
    opacity: 0.15;
    transform: scale(0.5);
  }
  to {
    opacity: 1;
    transform: scale(1.5);
  }
}

@keyframes falling {
  0% {
    transform: translate3d(0, -10vh, 0) rotate(0deg);
  }
  50% {
    transform: translate3d(35px, 50vh, 0) rotate(180deg);
  }
  100% {
    transform: translate3d(-15px, 110vh, 0) rotate(360deg);
  }
}

@media (max-width: 600px) {
  .start-area {
    left: 34%;
    top: 56%;
    width: 33%;
    height: 18%;
  }

  .message {
    font-size: 11px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .forest, .sunbeam, .sparkle, .leaf {
    animation: none !important;
  }
}
</style>
</head>

<body>
<main class="scene">

  <!-- Muat naik gambar ilustrasi ke repositori dengan nama forest.png -->
  <img
    class="forest"
    src="forest.png"
    alt="Hutan fantasi 3D RimbaRona"
  >

  <div class="sunbeam"></div>
  <div id="effects" aria-hidden="true"></div>

  <!-- Kawasan klik lutsinar pada butang MULA dalam gambar -->
  <button
    class="start-area"
    id="mula"
    aria-label="Mula pengembaraan"
    title="MULA">
  </button>

  <div class="message" id="message" role="status"></div>
</main>

<script>
const effects = document.getElementById("effects");

// Kilauan cahaya pada beberapa bahagian hutan
const positions = [
  [8, 15], [18, 30], [29, 12], [74, 18],
  [88, 29], [82, 52], [14, 68], [30, 83],
  [69, 85], [92, 72], [55, 18], [46, 76],
  [7, 47], [94, 12], [62, 38], [24, 58]
];

positions.forEach((point, i) => {
  const star = document.createElement("span");
  star.className = "sparkle";
  star.style.left = point[0] + "%";
  star.style.top = point[1] + "%";
  star.style.animationDelay = (-i * 0.35) + "s";
  star.style.animationDuration = (2 + (i % 4) * 0.5) + "s";
  effects.appendChild(star);
});

// Daun gugur secara perlahan
["🍃", "🍂", "🍃", "🍂", "🍃"].forEach((symbol, i) => {
  const leaf = document.createElement("span");
  leaf.className = "leaf";
  leaf.textContent = symbol;
  leaf.style.left = (12 + i * 19) + "%";
  leaf.style.setProperty("--speed", (12 + i * 2) + "s");
  leaf.style.setProperty("--delay", (-i * 3) + "s");
  effects.appendChild(leaf);
});

// Butang akan disambungkan ke halaman kedua kemudian
document.getElementById("mula").addEventListener("click", () => {
  const message = document.getElementById("message");
  message.textContent =
    "Pengembaraan RimbaRona akan bermula!";
  message.classList.add("show");

  setTimeout(() => {
    message.classList.remove("show");
  }, 2200);
});
</script>
</body>
</html>
